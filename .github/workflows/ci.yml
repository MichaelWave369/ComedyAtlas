name: ComedyAtlas CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.mjs && node --check src/rhythm-studio.mjs && node --check src/rhythm-core.mjs && node --check src/studio.mjs && node --check src/audio-lab.mjs && node --check src/audio-core.mjs && node --check src/pattern-core.mjs && node --check src/pattern-lab.mjs && node --check src/evidence-core.mjs && node --check src/evidence-studio.mjs
      - run: npm test
